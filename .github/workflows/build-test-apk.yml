name: Build test APK (Android edit-screen fix)

# Builds the SparkyFitness Android app with the edit-screen layout fix applied.
# The app is installed as a separate "Sparky TEST" app, so it sits beside the
# Play Store version instead of replacing it. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:MaxMetaspaceSize=1024m\""
    steps:
      - name: Get the SparkyFitness code (version the fix was written against)
        uses: actions/checkout@v4
        with:
          repository: CodeWithCJ/SparkyFitness
          ref: 985feaa9d8061476862c7d96c745a36307787233

      - name: Apply the fix
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | gunzip | git apply -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and generate the Android project
        run: |
          pnpm install --frozen-lockfile
          cd SparkyFitnessMobile
          APP_VARIANT=production npx expo prebuild --platform android
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          # Separate app id and name so it installs beside the Play Store app
          sed -i '0,/applicationId .*/s//&\n        applicationIdSuffix ".fixtest"/' android/app/build.gradle
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Sparky TEST</string>|' android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew

      - name: Build the APK
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :react-native-async-storage_async-storage:generateCodegenArtifactsFromSchema
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sparky-test-apk
          path: SparkyFitnessMobile/android/app/build/outputs/apk/release/*.apk
